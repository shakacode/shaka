name: Windows

# Free windows-latest runner. The job and each step continue after a failure so one
# Windows bug does not hide the others, and so a red step does not block merge.
# Pull requests and pushes run the quick steps. The full test suite takes about
# 20 minutes, so it runs nightly and when someone starts this workflow by hand.
# Every pull request reports this check, so main can require it. A change the shared
# classifier admits as documentation only skips every step after detection.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      SHAKA_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Keep Git line endings as stored
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect documentation-only changes
        id: changes
        run: |
          if ! comparison=$(git merge-base "$SHAKA_BASE_REF" HEAD 2>/dev/null); then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          trusted_classifier="$RUNNER_TEMP/docs-only-change"
          if git show "${SHAKA_BASE_REF}:bin/docs-only-change" > "$trusted_classifier"; then
            chmod +x "$trusted_classifier"
            if "$trusted_classifier" "$SHAKA_BASE_REF"; then
              git diff --check "$comparison" --
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "docs_only=false" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        if: steps.changes.outputs.docs_only != 'true'
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Documentation navigation
        if: steps.changes.outputs.docs_only != 'true'
        continue-on-error: true
        run: ruby bin/check-docs-navigation

      - name: shaka doctor
        if: steps.changes.outputs.docs_only != 'true'
        continue-on-error: true
        run: ruby bin/windows-exercise doctor

      - name: Repository commands
        if: steps.changes.outputs.docs_only != 'true'
        continue-on-error: true
        run: ruby bin/windows-exercise commands

      - name: Cursor usage hook
        if: steps.changes.outputs.docs_only != 'true'
        continue-on-error: true
        run: ruby bin/windows-exercise cursor

      # PowerShell, as a native Windows user starts Shaka; the exercise also drops Git's Unix tools from PATH.
      - name: Product command starts
        if: steps.changes.outputs.docs_only != 'true'
        continue-on-error: true
        shell: pwsh
        run: ruby bin/windows-exercise product

      # Each test file runs on its own. A file still running after 90s is
      # killed and printed as a WINDOWS suite gap. On current main, test_helper
      # raises "git executable not found" until pull request 748 looks up
      # git.exe, and the suite stops after the first file that hits that.
      # A windows-latest run that includes that lookup (actions run 39495412891)
      # then finished 172 files and failed 205. The repeated causes were
      # Errno::ENOEXEC spawning an extensionless shebang, ArgumentError from
      # pgroup, harbor paths rejected unless they start with "/", File.open
      # on a directory in the budget ledger, ENAMETOOLONG under the install
      # home, and require pty in test/local_evaluation_probe_container_test.rb.
      # Five private trial files were still running at 90s.
      - name: Test suite
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SHAKA_TEST_WORKERS: "2"
        run: ruby bin/windows-exercise suite
