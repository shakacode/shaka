name: Windows

# Free windows-latest runner. This workflow is not the required validate check.
# The job and each step continue after a failure so one Windows bug does not hide
# the others, and so a red step does not block merge. Justin decides when to require it.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      # Gems in the lockfile are pure Ruby or ship a generic platform build.
      BUNDLE_FORCE_RUBY_PLATFORM: "true"
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Keep Git line endings as stored
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: shaka doctor
        continue-on-error: true
        run: ruby bin/windows-exercise doctor

      - name: Repository commands
        continue-on-error: true
        run: ruby bin/windows-exercise commands

      - name: Cursor usage hook
        continue-on-error: true
        run: ruby bin/windows-exercise cursor

      # Full Minitest suite. On Windows the suite cannot start until test_helper
      # finds git.exe; that lookup is part of pull request 748. Other failures
      # are gaps to list here once a run gets past that load error.
      - name: Test suite
        continue-on-error: true
        env:
          SHAKA_TEST_WORKERS: "2"
        run: ruby bin/windows-exercise suite
