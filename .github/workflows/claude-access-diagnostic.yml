name: Temporary Claude access diagnostic

# DEBUG-853: remove after the hosted provider failure is diagnosed.
on:
  push:
    branches: [justin808-codex/ad-hoc-publisher-wording-task-timing]
    paths: [.github/workflows/claude-access-diagnostic.yml]

permissions: {}

jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prepare empty probe directory
        run: mkdir -p "$RUNNER_TEMP/shaka-claude-probe"

      - name: Test the existing review credential
        uses: anthropics/claude-code-action/base-action@f27be6b65a4652f08a2ba3cff79114829b588967
        continue-on-error: true
        env:
          CLAUDE_WORKING_DIR: ${{ runner.temp }}/shaka-claude-probe
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: Reply with exactly OK. Do not use tools.
          settings: '{"disableAllHooks":true}'
          claude_args: --max-turns 1 --tools "" --disable-slash-commands
          show_full_output: false

      - name: Encrypt the diagnostic for local inspection
        if: always()
        env:
          DIAGNOSTIC_CERTIFICATE: |
