---
version: 1
base_branch: main
plan: docs/pilot-plan.md
commands:
  setup: .agents/bin/setup
  validate: .agents/bin/validate
  test: .agents/bin/test
review:
  required: meaningful_changes
  check: claude-review
merge:
  preference: auto
  method: squash
  release: explicit_approval
protection:
  required_checks:
    - validate
  direct_push: false
  force_push: false
  branch_deletion: false
trusted_actions:
  - actions/checkout
  - anthropics/claude-code-action
  - ruby/setup-ruby
