# Shaka repository contract. Every setting is documented in docs/settings.md.
# Validate any change with: shaka seam check --root .
---
version: 1
# Branch that new work starts from and merges into.
base_branch: main
# Optional repository-relative plan document.
plan: docs/pilot-plan.md
# Reviewer policy. A fresh context is what makes a review adversarial, so the implementation
# model qualifies; a different provider is only preferred.
review:
  required: meaningful_changes
  check: claude-review
  # Ordered reviewer preference. `shaka reviewer` chooses from this list; the rule lives in
  # docs/settings.md#reviewreviewers, so do not restate it here.
  reviewers:
    - provider: anthropic
      model_family: claude
    - provider: openai
      model_family: codex
    - provider: xai
      model_family: grok
# Merge authority for a finished pull request.
merge:
  preference: ask
# Feature-branch layout. {login} is gh api user --jq .login; {host} is the tool.
branches:
  name: '{login}-{host}/{issue}-{description}'
