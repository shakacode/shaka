# Shaka settings for this repository. See docs/reference/configuration.md.
---
version: 1 # Configuration format, independent of the Shaka release version.
repo_prefix: SHAKA
plan: docs/pilot-plan.md # Product requirements to read when planning work.
review:
  required: meaningful_changes
  ci_review_jobs:
    - claude-review
  ci_review_wait: one
  # Local reviewer identities, in preference order.
  local_review_agents:
    - provider: anthropic
      model_family: claude
    - provider: openai
      model_family: codex
    - provider: xai
      model_family: grok
merge:
  preference: ask
branches:
  name: '{login}-{host}/{issue}-{description}'
