# Repository settings: docs/configuration.md
# Check edits with: shaka seam check --root . --local
# Load trusted policy with --ref and an immutable default-branch commit.
---
version: 1
repo_prefix: SHAKA
plan: docs/pilot-plan.md
# base_branch is omitted: use the repository's default branch.
review:
  required: meaningful_changes
  ci_review_jobs:
    - claude-review
  pace: swift
  # Local reviewer identities, in preference order.
  local_review_agents:
    - provider: anthropic
      model_family: claude
    - provider: openai
      model_family: codex
    - provider: xai
      model_family: grok
merge:
  preference: ask
branches:
  name: '{login}-{host}/{issue}-{description}'
