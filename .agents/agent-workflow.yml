# Shaka repository contract. Every setting is documented in docs/agents/settings.md.
# Candidate/local validation (no authority): shaka seam check --root . --local
# Trusted policy: shaka seam check --root . --ref SHA after resolving the default branch.
---
version: 1
# base_branch is omitted, so it resolves to this repository's default branch, main.
# A task may still name a different base for itself; that never changes where policy is read from.
# Short display prefix for RCT/MCT titles. Presentation only.
repo_prefix: SHAKA
# Optional repository-relative plan document.
plan: docs/pilot-plan.md
# Reviewer policy. Each key is documented in docs/agents/settings.md#review.
# A fresh context is what makes a review adversarial, so the implementation
# model qualifies; a different provider is only preferred.
review:
  # always, meaningful_changes, or none
  required: meaningful_changes
  # CI job names to read. Not required merge checks. Repeat an entry for another job.
  ci_review_jobs:
    - claude-review
  # swift or thorough. Omitted means swift.
  pace: swift
  # Local review agents, in preference order. Not the CI jobs above.
  local_review_agents:
    - provider: anthropic
      model_family: claude
    - provider: openai
      model_family: codex
    - provider: xai
      model_family: grok
# Merge authority for a finished pull request.
merge:
  preference: ask
# Feature-branch layout. {login} is gh api user --jq .login; {host} is the tool.
branches:
  name: '{login}-{host}/{issue}-{description}'
