# Shaka's settings for its own repository, a browsable example of every setting.
# A setting this repository leaves unset appears commented out with its default.
# You rarely need to edit it; ask your agent: `$shaka Wait for all configured CI reviewers.`
# Each comment gives the default; where this repository chooses otherwise, it says why.
# All of Shaka's defaults in one place: skills/shaka/config/defaults.yml.
# Every option: docs/settings.md (https://shaka.shakacode.com/docs/settings).
# README.md explains where this repository differs from the defaults.
# Changes take effect once merged into the default branch.
---
version: 1 # Required. The configuration format, not the Shaka release.
repo_prefix: SHAKA # Default: derived from the repo name ("SHAK" here); we prefer the full name.
# base_branch: main # Default: the repository's default branch.

review:
  startup_check: true # Default: check selected reviewers before implementation; may consume quota.
  # Required, no default; setup asks. meaningful_changes lets trivial prose skip review;
  # the others are always and none.
  required: meaningful_changes
  ci_review_jobs: # Required unless review.required is none: the GitHub jobs that post AI reviews.
    - claude-review
  ci_review_wait: one # Default. A word, not a number: none, one, or all CI review reports.
  local_max_rounds: 5 # Default: most commits one local review covers before the agent asks you.
  # Default: none, so local_review_count sets how many review. Ours: Claude and Codex
  # both review every commit, because a mistake in Shaka weakens checks on every project.
  provider_coverage: [anthropic, openai]
  # local_review_count: 1 # Default: reviewers per commit. Set this or provider_coverage, not both.
  # Default: added after Shaka's code review prompt when it exists. Ours weighs the cost of
  # instruction changes (README.md); naming it here makes a missing file an error.
  custom_instructions_file: .agents/shaka/instructions/review.md
  # Default: Shaka's review prompt. A file here replaces it; prefer custom_instructions_file.
  # replacement_prompt_file: .agents/shaka/review-prompt.md
  # Default: none, so the implementing model reviews in a fresh session.
  # Ours: reviewers from other providers first, in this order.
  local_review_agents:
    - provider: anthropic
      model_family: claude # No model or effort: use the Claude CLI's defaults.
      # replacement_prompt_file: .agents/shaka/review-prompt-claude.md # Default: review.replacement_prompt_file.
    - provider: openai
      model_family: codex
    # Optional: provider_coverage never picks these, so they run only when a task names one.
    # doctor warns about their missing setup only when ~/.agents/shaka/local-reviewers.yml lists them.
    - provider: deepseek # Needs OPENROUTER_API_KEY; deadline 600 seconds by default.
      model_family: openrouter
      model: deepseek/deepseek-v4.1-flash
      effort: low
    - provider: xai # Needs a model named in the task.
      model_family: grok

checkpoint: # Defaults: the final "did we build the right thing?" check before merge.
  enabled: true # false skips the checkpoint; the PR then needs a visible opt-out note.
  reviewer: openai/codex
  model: gpt-6.1-sol
  effort: medium
  # Default: added after Shaka's checkpoint prompt when it exists. Ours holds the instruction-cost
  # check (README.md); naming it here makes a missing file an error.
  custom_instructions_file: .agents/shaka/instructions/checkpoint.md
  # Default: Shaka's checkpoint prompt. A file here replaces it; prefer custom_instructions_file.
  # replacement_prompt_file: .agents/shaka/checkpoint-prompt.md

merge:
  preference: ask # Required; setup suggests ask: you merge on GitHub. auto lets the agent merge.
  # required_checks: [validate] # Default: none; use when GitHub requires no checks.
  limits: # Defaults. A larger PR needs your confirmation before the agent merges it.
    max_changed_files: 29
    max_changed_lines: 999 # Additions plus deletions.
    max_commits: 9
  # Default: 5, any human review floor (below). Ours: 2, so Auto would merge code, tests, and reference
  # pages and hand back other docs, agent instructions, and settings, merge, trust, validation, and
  # install code.
  # While preference is ask, each ready checkpoint says whether Auto would merge the PR.
  auto_max_review_floor: 2
  hold_labels: [hold] # Default. Shaka never merges a PR carrying one of these; remove it to merge.

branches:
  name: '{login}-{host}/{issue}-{description}' # Default branch-name template.

wip:
  include_checkout_path: true # Default: show the local checkout path in unfinished PRs.

pr_description:
  show_shaka_credit: true # Default: a small Shaka link under the PR summary.
  show_human_comments: true # Default: list comments people wrote on the PR.
  max_human_comments: 20 # Default: how many of those comments to list.
  time_zone: America/Los_Angeles # Ours: the PR timings' readers. Default: UTC, or the user's zone when set.
  # Default: Shaka's shipped floors. The lowest human review effort a PR may claim, from the
  # files it changes. This list replaces the default one. Ours adds the first three floors and the
  # validation and install floor, names merge-gate and trust code in the trust floor, and
  # exempts Shaka's Ruby library code from the agent-instructions floor, so
  # auto_max_review_floor can tell them apart. The rest are the defaults.
  human_review_floors:
    - level: 5
      reason: changes docs for Shaka's users
      paths: [docs/**/*]
      except: [docs/reference/**/*]
    - level: 2 # A skim, and at auto_max_review_floor, so Auto can merge a reference-only PR.
      reason: changes a reference page
      paths: [docs/reference/**/*]
    - level: 4
      reason: changes evidence or settings checks
      paths: ['skills/shaka/lib/shaka/{evidence,seam,repository_config,configuration}/**/*',
              'skills/shaka/lib/shaka/{seam,repository_config,configuration}.rb']
    - level: 5
      reason: changes Shaka's repository configuration
      paths: [.agents/shaka/**/*]
    - level: 4
      reason: changes trust, merge, authentication, or release paths
      paths: [.github/workflows/**/*, .github/actions/**/*, CODEOWNERS, .github/CODEOWNERS, docs/CODEOWNERS,
              'skills/shaka/lib/shaka/{required_checks,ci_review_wait,review_coverage,public_comments,defaults}.rb',
              'skills/shaka/lib/shaka/publication/{review_effort_floor,feature_guard,verification_gates}.rb',
              skills/shaka/lib/shaka/public_comments/**/*]
      words: [auth, authentication, authorization, oauth, merge, release, trust, trusted, permission, secret,
              credential]
      except: ['**/*.md', '**/*.{png,jpg,jpeg,gif,svg,webp}']
    - level: 3
      reason: changes validation, install, update, or GitHub code
      paths: [bin/**/*, .rubocop.yml, .ruby-version, 'Gemfile{,.lock}', shaka.gemspec,
              'skills/shaka/lib/shaka/{installer,update_check,github}.rb',
              'skills/shaka/lib/shaka/{install,update_check,github}/**/*']
    - level: 3
      reason: changes agent instructions
      paths: ['**/AGENTS.md', '**/CLAUDE.md', '**/SKILL.md', skills/**/*, .agents/**/*, .claude/**/*, .cursor/**/*]
      except: ['skills/shaka/lib/**/*.rb']
    - level: 2
      reason: changes code or configuration
      paths: ['**/*']
      except: ['**/*.md', docs/**/*, '**/*.{png,jpg,jpeg,gif,svg,webp}']
  opening_check:
    enabled: true # Default: check that the PR description's first sentence leads with the outcome.
    effort: low # Default.
    # This repository's choice. Without a reviewer, the agent checks its own opening unless
    # it passes --opening-reviewer.
    reviewer: openai/codex
    # Set reviewer with model; Grok and OpenRouter need a model.
    # model: gpt-6.1-sol # Default: the reviewer's CLI default.
    # replacement_prompt_file: .agents/shaka/opening.md # Default: Shaka's opening prompt.

# Default: none. Repository instructions the agent reads at three moments of each task.
project_guidance:
  pr_evidence: .agents/shaka/pr-evidence.md # Before writing the PR description.
  # merge_readiness: .agents/shaka/merge-readiness.md # Before the final checkpoint.
  walkthrough: .agents/shaka/walkthrough.md # Before writing the code walkthrough.

prose_limits: # Defaults: word limits for PR descriptions and walkthroughs.
  max_sentence_words: 35
  max_paragraph_words: 100
  max_description_words: 300
  words_per_changed_line: 4 # Text may use 150 words plus this many per changed line.

# Commands live in bin/ beside this file: setup, test, and validate. Optional, unused here:
# validate-local (faster checks before local review) and trigger-hosted-ci (needs validate-local).
# Review timeouts and pr watch timing are command flags, not settings (runtime in defaults.yml).
# Whose public comments the agent may read: trusted-github-actors.yml.
