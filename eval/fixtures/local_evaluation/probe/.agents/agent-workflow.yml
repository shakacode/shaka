---
version: 1
base_branch: main
commands:
  setup: .agents/bin/setup
  validate: .agents/bin/test
  test: .agents/bin/test
review: { required: none }
merge: { preference: auto, method: squash, release: explicit_approval }
protection:
  required_checks: [validate]
  direct_push: false
  force_push: false
  branch_deletion: false
trusted_actions: [actions/checkout, ruby/setup-ruby]
