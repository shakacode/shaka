inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-minitest
  - rubocop-performance

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.4
  Exclude:
    - 'eval/fixtures/local_evaluation/**/*'

# Blank-line-before-assert and a 3-assert cap rewrite the existing suite.
# Remaining Minitest and Performance cops stay at plugin defaults.
Minitest/EmptyLineBeforeAssertionMethods:
  Enabled: false
Minitest/MultipleAssertions:
  Enabled: false
Minitest/AssertWithExpectedArgument:
  Enabled: false
