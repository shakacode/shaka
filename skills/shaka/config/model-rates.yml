# Model rate card. The installed usage command reads this file from a candidate
# checkout for implementation estimates. Pricing formulas stay in the installed code.
# OpenAI credits and api, and Cursor standard and fast, are input, cached input, and
# output per million tokens. Anthropic prices are input, cache read, 5-minute cache
# write, 1-hour cache write, and output per million tokens. Google prices are input, cache
# read, and output per million tokens; a price under `from` applies from that UTC date of the
# response. Retired models are omitted.
