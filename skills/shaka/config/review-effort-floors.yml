# The lowest review effort a PR description may claim, from the paths the PR changes.
# The highest matching floor applies; the agent may rate effort higher, never lower.
# A path matches a floor through one of its `paths` globs, a name token in `words`
# (a word, or the word plus a trailing s) unless it matches a `words_except` glob, or by
# matching none of its `all_except` globs.
# Renamed files count under both names. Editing this file changes every repository.
---
floors:
  - level: 4
    reason: changes trust, merge, authentication, or release paths
    paths:
      - .github/workflows/**/*
      - .github/actions/**/*
      - CODEOWNERS
      - .github/CODEOWNERS
      - docs/CODEOWNERS
      - .agents/shaka/**/*
    words: [auth, authentication, authorization, oauth, merge, release, trust, trusted,
            permission, secret, credential, token]
    words_except: ['**/*.md', docs/**/*]
  - level: 2
    reason: changes agent instructions
    paths:
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '**/SKILL.md'
      - skills/**/*
      - .agents/**/*
      - .claude/**/*
      - .cursor/**/*
  - level: 2
    reason: changes code or configuration
    all_except:
      - '**/*.md'
      - docs/**/*
      - '**/*.{png,jpg,jpeg,gif,svg,webp}'
