# Files Shaka reads by name from a repository's .agents/shaka/ directory, without a setting.
# Each top-level key is a directory there. seam init writes the directory's README from its
# introduction and a table of its files, and the code that reads a file takes its path from here.
---
prompts:
  introduction: |
    Each file here adds your own instructions to one of Shaka's built-in prompts, named
    by the file. Shaka's prompt still applies in full: the reviewer reads it, then this
    repository's applicable `AGENTS.md` files, then the file here. Your file wins when it
    conflicts with the questions and criteria before it, though it cannot relax Shaka's
    safety rules or change what the reviewer must report.

    Put a rule for every agent in `AGENTS.md` and a rule for one prompt here. Shaka reads
    these files from the default branch, so a pull request cannot change the rules it is
    reviewed by. A file Shaka does not list below is ignored.
  files:
    checkpoint.md:
      adds_to: '[Checkpoint prompt](https://github.com/shakacode/shaka/blob/main/skills/shaka/config/post-implementation-prompt.md)'
      reader: Checkpoint reviewer
      when: The "did we build the right thing?" check before merge
      absent: Shaka's prompt alone; an empty file counts as absent
      docs: https://shaka.shakacode.com/docs/settings#checkpoint
