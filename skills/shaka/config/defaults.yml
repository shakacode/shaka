# Shaka's built-in defaults, applied when a repository's .agents/shaka/config.yml omits a value.
# Keys mirror that file, so a repository's choices can be compared with these line by line.
# Reference: docs/settings.md. Editing this file changes Shaka's behavior for every repository.
---
review:
  startup_check: true # Probe selected local reviewers before implementation; may consume quota.
  ci_review_wait: one # Wait for one configured hosted review report before merge.
  local_max_rounds: 5 # Committed heads one local review ledger may review.
  local_review_count: 1 # Local reviewers run on each committed head; unused when provider_coverage lists providers.
  provider_coverage: [] # One local reviewer per listed provider, in place of local_review_count.
  # Added after the code review prompt when it exists. Naming it in config.yml makes the file required.
  custom_instructions_file: .agents/shaka/instructions/review.md

checkpoint: # The finished-result checkpoint before merge readiness.
  enabled: true
  reviewer: openai/codex
  model: gpt-6.1-sol # Applies only while the reviewer above is selected.
  effort: medium
  # Added after the checkpoint prompt when it exists. Naming it in config.yml makes the file required.
  custom_instructions_file: .agents/shaka/instructions/checkpoint.md

high_risk_areas: # A change here is always high risk, whatever the checkpoint rates it.
  database: [db/migrate/**/*, '**/migrations/**/*', db/schema.rb, db/structure.sql, '**/*.sql', '**/schema.prisma']
  persistence: [config/database.yml, config/storage.yml, 'config/cache*.yml', config/redis.yml, config/sidekiq.yml]
  infrastructure: ['**/*.tf', '**/*.tfvars', infra/**/*, k8s/**/*, '**/charts/**/*', '**/Dockerfile*',
                   '**/docker-compose*.yml', .controlplane/**/*, fly.toml]
  ci_and_trust: [.github/workflows/**/*, .github/actions/**/*, CODEOWNERS, .github/CODEOWNERS, docs/CODEOWNERS]
  # A path segment named for a word, alone or joined by _ or -, as auth_controller.rb or oauth/; not authors.md.
  security:
    - '**/{auth,oauth,authentication,authorization,permission,secret,credential}{,s}{,.*,_*,-*}'
    - '**/*[_-]{auth,oauth,authentication,authorization,permission,secret,credential}{,s}{,.*,_*,-*}'
    - '**/{auth,oauth,authentication,authorization,permission,secret,credential}{,s}{,_*,-*}/**/*'
    - '**/*[_-]{auth,oauth,authentication,authorization,permission,secret,credential}{,s}{,_*,-*}/**/*'
  shaka: [.agents/shaka/**/*]

medium_risk_areas: # A change here counts as at least medium risk, so a person skims it before it merges.
  agent_instructions: ['**/AGENTS.md', '**/CLAUDE.md', '**/SKILL.md', .claude/**/*, .cursor/**/*]

merge:
  preference: ask # Setup writes this; config.yml must state a preference.
  limits: # A merge past any limit needs confirmation of the exact head.
    max_changed_files: 29
    max_changed_lines: 999 # Additions plus deletions.
    max_commits: 9
  # The highest checkpoint risk the agent may merge without a person confirming the head: low merges low
  # only; medium merges low and medium. High never merges this way, nor does a PR in a high_risk_areas entry.
  auto_merge_max_risk: low
  hold_labels: [hold] # A PR carrying any of these never merges through Shaka until a person removes it.

branches:
  name: '{login}-{host}/{issue}-{description}' # Feature branch-name template.

wip:
  include_checkout_path: true # Publish the checkout path in WIP Details.

pr_description:
  show_shaka_credit: true # Show a quiet Shaka website credit below the PR summary.
  show_human_comments: true # List the comments people wrote on the PR.
  max_human_comments: 20 # Rows that list shows, open comments first.
  # Comments the list leaves out when their whole text matches one of these; * matches any characters but whitespace.
  ignored_human_comments: []
  time_zone: UTC # Zone of the times in the Timings section; a repository that sets none uses the user's.
  opening_check:
    enabled: true # Check description and walkthrough openings, and description terms, after publication.
    effort: low # Independent of the code-review effort.

prose_limits: # Visible PR description and walkthrough prose.
  max_sentence_words: 35
  max_paragraph_words: 100
  max_description_words: 300
  words_per_changed_line: 4 # Proportional budget: 150 words plus this many per changed line.

project_guidance: {} # None: no repository guides for PR evidence, merge readiness, or walkthroughs.

# Defaults for command execution and generated configuration.
runtime:
  private_setup_include_checkout_path: false
  review_timeout_seconds: # shaka review run --timeout-seconds, by reviewer.
    default: 300
    deepseek/openrouter: 600
  pr_watch: # shaka pr watch --interval, --timeout, and --settle.
    interval_seconds: 60
    timeout_seconds: 3600
    settle_seconds: 15
