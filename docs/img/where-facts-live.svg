<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 278" role="img" aria-labelledby="t d">
<title id="t">Where a Shaka task keeps its facts</title>
<desc id="d">The work item holds why the work exists: priority, scope, and dependencies. GitHub holds delivery evidence: commits, checks, reviews, and the pull request outcome. The agent task holds experiments and unpushed work and is temporary. A fresh pull request reader can reconstruct the owner, blocker, revision, and next step from the work item and GitHub.</desc>
<style>
.bg{fill:#fff;stroke:#d9e0e7}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0f1724}
.h{font-size:15px;font-weight:600}
.s{font-size:13px}
.m{fill:#516074}
.c{text-anchor:middle}
rect{stroke-width:1}
.you rect{fill:#fdf3df;stroke:#b87514}
.you text{fill:#5f3b06}
.shaka rect{fill:#e3f5ec;stroke:#128a5e}
.shaka text{fill:#0b4f37}
.box rect{fill:#f1f4f8;stroke:#8a99ad}
.frame{fill:none;stroke:#8a99ad;stroke-dasharray:6 4}
.a{stroke:#516074;stroke-width:1.5;fill:none}
.ah{fill:#516074}
.dash,.dash rect{stroke-dasharray:5 4}
@media (prefers-color-scheme:dark){
.bg{fill:#0f1724;stroke:#2a3648}
text{fill:#e6edf5}
.m{fill:#9fb0c3}
.you rect{fill:#40300f;stroke:#e0a13a}
.you text{fill:#fbe3b0}
.shaka rect{fill:#0e3d2c;stroke:#3ccf92}
.shaka text{fill:#c9f3e0}
.box rect{fill:#1a2535;stroke:#6b7c93}
.frame{stroke:#6b7c93}
.a{stroke:#9fb0c3}
.ah{fill:#9fb0c3}
}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="719" height="277" rx="10"/>
<g class="box"><rect x="40" y="40" width="200" height="90" rx="6"/><text class="h c" x="140" y="72">Work item</text><text class="s c" x="140" y="90">Why: priority, scope,</text><text class="s c" x="140" y="108">and dependencies</text></g>
<g class="box"><rect x="260" y="40" width="200" height="90" rx="6"/><text class="h c" x="360" y="72">GitHub</text><text class="s c" x="360" y="90">Delivery evidence: commits,</text><text class="s c" x="360" y="108">checks, reviews, PR outcome</text></g>
<g class="box dash"><rect x="480" y="40" width="200" height="90" rx="6"/><text class="h c" x="580" y="72">Agent task</text><text class="s c" x="580" y="90">Experiments and</text><text class="s c" x="580" y="108">unpushed work</text></g>
<text class="s m c" x="580" y="152">Temporary</text>
<path class="a" d="M140 130V188" marker-end="url(#ar)"/>
<path class="a" d="M360 130V188" marker-end="url(#ar)"/>
<g class="you"><rect x="40" y="190" width="420" height="64" rx="6"/><text class="h c" x="250" y="218">A fresh PR reader can reconstruct</text><text class="s c" x="250" y="236">owner, blocker, revision, and next step</text></g>
</svg>
