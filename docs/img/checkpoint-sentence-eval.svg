<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" role="img" aria-labelledby="t d">
<title id="t">Checkpoint reports with and without the blast-radius sentence</title>
<desc id="d">Runs out of five per arm, both prompts pooled. Shared-caller PR #695: said whether a revert undoes it, 0 without and 5 with; named an untested consuming command, 0 and 5; found that the HTTP status never reaches users, 5 and 3. Merge-path PR #552: said a revert cannot undo a merge, 0 and 5; said no live GitHub merge ran, 0 and 5; flagged the untested consent decision, 0 and 5; concluded Simplify/reframe, 0 and 3. Docs edit #635: Proceed with no concerns, 5 and 5.</desc>
<style>
.bg{fill:#fff;stroke:#d9e0e7}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0f1724}
.h{font-size:15px;font-weight:600}
.g{font-size:13px;font-weight:600}
.s{font-size:12.5px}
.n{font-size:12px;font-weight:600}
.m{fill:#516074}
.e{text-anchor:end}
.grid{stroke:#e4e9ef;stroke-width:1}
.wo{fill:#c3ccd8}
.wi{fill:#128a5e}
.cost{fill:#b87514}
@media (prefers-color-scheme:dark){
.bg{fill:#0f1724;stroke:#2a3648}
text{fill:#e6edf5}
.m{fill:#9fb0c3}
.grid{stroke:#223044}
.wo{fill:#4a5a70}
.wi{fill:#3ccf92}
.cost{fill:#e0a13a}
}
</style>
<rect class="bg" x="0.5" y="0.5" width="719" height="451" rx="8"/>
<text class="h" x="24" y="32">Runs meeting each criterion, out of 5 per arm</text>
<rect class="wo" x="410" y="22" width="14" height="10" rx="2"/>
<text class="s m" x="430" y="31">without the sentence</text>
<rect class="wi" x="560" y="22" width="14" height="10" rx="2"/>
<text class="s m" x="580" y="31">with the sentence</text>
<g>
<line class="grid" x1="400" y1="52" x2="400" y2="430"/>
<line class="grid" x1="460" y1="52" x2="460" y2="430"/>
<line class="grid" x1="520" y1="52" x2="520" y2="430"/>
<line class="grid" x1="580" y1="52" x2="580" y2="430"/>
<line class="grid" x1="640" y1="52" x2="640" y2="430"/>
<line class="grid" x1="700" y1="52" x2="700" y2="430"/>
</g>
<text class="g" x="24" y="66">Shared caller, #695</text>
<text class="s" x="384" y="90" text-anchor="end">Said whether a revert undoes it</text>
<rect class="wo" x="400" y="80" width="2" height="9"/><text class="n m" x="408" y="89">0</text>
<rect class="wi" x="400" y="91" width="300" height="9"/><text class="n" x="706" y="100">5</text>
<text class="s" x="384" y="124" text-anchor="end">Named an untested consuming command</text>
<rect class="wo" x="400" y="114" width="2" height="9"/><text class="n m" x="408" y="123">0</text>
<rect class="wi" x="400" y="125" width="300" height="9"/><text class="n" x="706" y="134">5</text>
<text class="s" x="384" y="158" text-anchor="end">Found: HTTP status never reaches users</text>
<rect class="wo" x="400" y="148" width="300" height="9"/><text class="n m" x="706" y="157">5</text>
<rect class="cost" x="400" y="159" width="180" height="9"/><text class="n" x="586" y="168">3</text>
