<text class="s" x="384" y="220" text-anchor="end">Said a revert cannot undo a merge</text>
<rect class="wo" x="400" y="210" width="2" height="9"/><text class="n m" x="408" y="219">0</text>
<rect class="wi" x="400" y="221" width="300" height="9"/><text class="n" x="706" y="230">5</text>
<text class="s" x="384" y="254" text-anchor="end">Said no live GitHub merge ran</text>
<rect class="wo" x="400" y="244" width="2" height="9"/><text class="n m" x="408" y="253">0</text>
<rect class="wi" x="400" y="255" width="300" height="9"/><text class="n" x="706" y="264">5</text>
<text class="s" x="384" y="288" text-anchor="end">Flagged the untested consent decision</text>
<rect class="wo" x="400" y="278" width="2" height="9"/><text class="n m" x="408" y="287">0</text>
<rect class="wi" x="400" y="289" width="300" height="9"/><text class="n" x="706" y="298">5</text>
<text class="s" x="384" y="322" text-anchor="end">Concluded Simplify/reframe</text>
