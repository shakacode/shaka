<text class="s" x="384" y="384" text-anchor="end">Proceed with no concerns</text>
<rect class="wo" x="400" y="374" width="300" height="9"/><text class="n m" x="706" y="383">5</text>
<rect class="wi" x="400" y="385" width="300" height="9"/><text class="n" x="706" y="394">5</text>
<text class="s m" x="24" y="424">Both prompts pooled. The orange bar is the cost: two runs with the sentence missed the #695 gap.</text>
</svg>
